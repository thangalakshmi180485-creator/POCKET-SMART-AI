<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketSmart - Create Account</title>
    <!-- பூட்ஸ்டார்ப் டிசைன் லைவ் லிங்க் -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- 👁️ கண் சின்னம் மற்றும் இதர ஐகான்கள் லோடு ஆவதற்கான அசல் லைவ் சிடிஎன் லிங்க்! -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        body { background-color: #ebf2f7; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .register-card { background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 40px; width: 100%; max-width: 400px; border: 1px solid #e2e8f0; }
        .btn-register { background-color: #1a4f8a; color: white; width: 100%; font-weight: bold; border-radius: 4px; padding: 10px; border: none; margin-top: 20px; cursor: pointer; }
        .btn-register:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>

<div class="register-card shadow-sm border p-4 bg-white rounded" style="max-width:400px;margin:80px auto;">
    <h4 class="text-center fw-bold mb-4" style="color: #0b2240;">Create Account</h4>
    
    <!-- 🎯 /register-save எண்ட்பாயிண்டிற்குப் புதிய விபரங்களை நேரடியாக அனுப்பும் அசல் படிவம்! -->
    <form action="/register-save" method="post">
        <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label text-muted small fw-bold mb-2 d-block">Username</label>
            <input type="text" name="username" class="form-control p-2 text-secondary" style="border: 1px solid #cbd5e1; border-radius: 6px;" placeholder="Choose a username" required>
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label text-muted small fw-bold mb-2 d-block">Email</label>
            <input type="email" name="email" class="form-control p-2 text-secondary" style="border: 1px solid #cbd5e1; border-radius: 6px;" placeholder="Enter your email" required>
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
    <label class="form-label text-muted small fw-bold mb-2 d-block">Password</label>
    <div class="input-group" style="display: flex;">
        <!-- 💡 பாஸ்வேர்டு உள்ளிட்ட இன்புட் பாக்ஸ் -->
        <input type="password" id="registerPassword" name="password" class="form-control p-2 text-secondary" style="border: 1px solid #cbd5e1; border-top-left-radius: 6px; border-bottom-left-radius: 6px; border-top-right-radius: 0; border-bottom-right-radius: 0; flex: 1;" placeholder="Create a strong password" required>
        <!-- 👁️ பாஸ்வேர்டை காட்டும் கண் சின்ன பட்டன் குறியீடு -->
        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" onclick="toggleRegisterPasswordVisibility()" style="border: 1px solid #cbd5e1; border-left: none; border-top-right-radius: 6px; border-bottom-right-radius: 6px; background: white; padding: 0 12px;">
            <i class="fa-solid fa-eye" id="eyeIcon" style="color: #64748b;"></i>
        </button>
    </div>
</div>
        
        <!-- 💡 இப்போ இந்த பட்டனை அமுக்கினால் எர்ரர் வராமல் நேராக /register-save-க்குள் சென்று விபரங்களைச் சேமிக்கும்! -->
        <button type="submit" class="btn-register shadow-sm">Register</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="/login" class="text-decoration-none small text-secondary">Already have an account? Sign In</a>
    </div>
</div>
<script>
function toggleRegisterPasswordVisibility() {
    const passwordField = document.getElementById('registerPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    
    // 🎯 பாஸ்வேர்டு டைப்பை மாற்றி புள்ளிகளை மறைக்கும்/காட்டும் அசல் லாஜிக்!
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash'); // கண் அடிபட்ட சின்னம் காட்டும்
    } else {
        passwordField.type = 'password';
        passwordField.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye'); // சாதாரண கண் சின்னம் காட்டும்
    }
}
</script>
</body>
</html>
