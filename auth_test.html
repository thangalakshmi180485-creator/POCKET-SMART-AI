<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketSmart AI - Auth Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(180deg, #0b1528 25%, #f4f6f9 25%); padding: 20px; }
        .auth-container { max-width: 450px; width: 100%; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        .auth-logo { font-size: 32px; font-weight: bold; color: #1d4ed8; margin-bottom: 5px; }
        .auth-subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; font-weight: 500; }
        .auth-page-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #0f274d; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #334155; }
        .auth-btn { background-color: #1e3a8a; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-btn:hover { background-color: #1d4ed8; }
        .auth-toggle { margin-top: 25px; font-size: 14px; color: #64748b; }
        .auth-toggle span { color: #1e3a8a; cursor: pointer; font-weight: bold; }
        .forgot-pw { text-align: right; margin-top: -10px; margin-bottom: 20px; font-size: 13px; color: #64748b; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. SIGN IN SCREEN -->
    <div id="login-panel" class="auth-container" style="display: block;">
        <div class="auth-logo">PocketSmart</div>
        <div class="auth-subtitle">AI-Powered Budget Planning</div>
        <div class="auth-page-title">Welcome Back</div>
        <div class="form-group"><label>Username</label><input type="text" placeholder="Enter your username" value="sai"></div>
        <div class="form-group"><label>Password</label><input type="password" placeholder="Enter your password" value="12345"></div>
        <div class="forgot-pw">Forgot Password?</div>
        <button class="auth-btn" onclick="alert('வெற்றிகரமாக உள்நுழைந்துவிட்டீர்கள்! பிரதான டேஷ்போர்டு தயாராக உள்ளது.')">Sign In ➔</button>
        <div class="auth-toggle">Don't have an account? <span onclick="toggleAuth('register-panel')">Create Account</span></div>
    </div>

    <!-- 2. CREATE ACCOUNT SCREEN -->
    <div id="register-panel" class="auth-container" style="display: none;">
        <div class="auth-logo">PocketSmart</div>
        <div class="auth-subtitle">AI-Powered Budget Planning</div>
        <div class="auth-page-title">Create Your Account</div>
        <div class="form-group"><label>Username</label><input type="text" placeholder="Choose a username"></div>
        <div class="form-group"><label>Email</label><input type="email" placeholder="Enter your email"></div>
        <div class="form-group"><label>Password</label><input type="password" placeholder="Create a strong password"></div>
        <button class="auth-btn" onclick="alert('உங்களது புதிய பயனர் கணக்கு வெற்றிகரமாக உருவாக்கப்பட்டது!')">Create Account ➔</button>
        <div class="auth-toggle">Already have an account? <span onclick="toggleAuth('login-panel')">Sign In</span></div>
    </div>

    <script>
        function toggleAuth(panelId) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('register-panel').style.display = 'none';
            document.getElementById(panelId).style.display = 'block';
        }
    </script>
</body>
</html>
