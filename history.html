<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PocketSmart - Recommendation History</title>
    <!-- பூட்ஸ்டார்ப் மற்றும் ஃபான்ட் டிசைன் லைவ் லிங்க்குகள் -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        body { background-color: #ebf2f7; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .navbar { background-color: #0b2240; padding: 12px 20px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; }
        .history-header { background-color: #1a4f8a; color: white; padding: 40px 20px; text-align: center; }
        .main-card { background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 30px; margin-top: 20px; border: 1px solid #e2e8f0; }
        .history-table th { background-color: #f8fafc; color: #1a4f8a; font-weight: bold; }
        /* 🔵 வியூ ஃபுல் அனாலிசிஸ் பட்டனுக்கான அசல் ஆரஞ்சு நிற ஸ்டைல் */
        .btn-full-analysis { background-color: #f39c12; color: white; font-weight: bold; border: none; padding: 5px 12px; border-radius: 4px; font-size: 0.78rem; text-decoration: none; display: inline-block; }
        .btn-full-analysis:hover { background-color: #d68010; color: white; }
    </style>
</head>
<body>

<nav class="navbar shadow-sm"><a href="/dashboard">PocketSmart</a></nav>

<div class="history-header shadow-sm">
    <h3 class="fw-bold m-0">Your Recommendation History</h3>
    <p class="m-0 mt-2 text-white-50" style="font-size:0.88rem;">Review and check past generated dynamic financial plan analytics</p>
</div>

<div class="container" style="max-width: 950px;">
    <div class="main-card shadow-sm">
        <div class="table-responsive">
            <table class="table table-bordered bg-white align-middle history-table" style="font-size:0.85rem;">
                <thead>
                    <tr class="table-light text-secondary">
                        <th>Module Name</th>
                        <th>Input Parameter Details</th>
                        <th>Action Buttons</th>
                    </tr>
                </thead>
            <tbody id="liveHistoryTableBody"></tbody>
            </table>
        </div>
        <div class="mt-4">
            <a href="/dashboard" class="btn btn-secondary btn-sm px-4" style="border-radius:4px;"><i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard</a>
        </div>
    </div>
</div>
<script>
// 🎯 ஹோம், பார்ட்டி, ஜுவல்லரி ஆகிய மூன்றும் நீங்கள் உள்ளிட்ட அசல் பட்ஜெட் தொகைகளுடன் வரிசையாகக் காட்டும் மாஸ்டர் லாஜிக்!
document.addEventListener("DOMContentLoaded", function() {
    const tableBody = document.getElementById('liveHistoryTableBody');
    if (!tableBody) return;

    // 💾 பிரவுசரின் லைவ் நினைவக முகவரியிலிருந்து பட்ஜெட் அளவுகளைப் பெறுகிறது
    const urlParams = new URLSearchParams(window.location.search);
    const budgetParam = parseFloat(urlParams.get('budget'));
    const referrer = document.referrer;

    // 💡 பயனர் உள்ளிட்ட அசல் மதிப்பை உடனுக்குடன் பிரவுசர் நினைவகத்தில் லாக் செய்கிறது
    if (budgetParam && budgetParam > 0) {
        if (referrer.includes("home") || window.location.href.includes("home")) {
            localStorage.setItem("live_home_budget_value", budgetParam);
        } else if (referrer.includes("party") || window.location.href.includes("party")) {
            localStorage.setItem("live_party_budget_value", budgetParam);
        } else if (referrer.includes("jewelry") || window.location.href.includes("jewelry")) {
            localStorage.setItem("live_jewelry_budget_value", budgetParam);
        }
    }

    // 📊 பிரவுசர் நினைவகத்தில் இருக்கும் அசல் விபரங்களை மட்டும் துல்லியமாக எடுக்கிறது
    const homeBudget = localStorage.getItem("live_home_budget_value");
    const partyBudget = localStorage.getItem("live_party_budget_value");
    const jewelryBudget = localStorage.getItem("live_jewelry_budget_value");

    let htmlRows = '';

    // 🏠 1. ஹோம் பிளானர் பட்ஜெட் விபரம்
    if (homeBudget) {
        htmlRows += '<tr>';
        htmlRows += '<td><strong>🏠 Home Budget Plan</strong></td>';
        htmlRows += '<td class="text-muted">Total Budget: $' + parseFloat(homeBudget).toLocaleString('en-US', {minimumFractionDigits: 2}) + ' | Dynamic allocation matrices applied successfully based on your custom boundaries.</td>';
        htmlRows += '<td><a href="/home?budget=' + homeBudget + '" class="btn-full-analysis"><i class="fa-solid fa-chart-line me-1"></i> View Full Analysis</a></td>';
        htmlRows += '</tr>';
    }

    // 🎉 2. பார்ட்டி பிளானர் பட்ஜெட் விபரம்
    if (partyBudget) {
        htmlRows += '<tr>';
        htmlRows += '<td><strong>🎉 Party Budget Plan</strong></td>';
        htmlRows += '<td class="text-muted">Total Party Budget: ₹' + parseFloat(partyBudget).toLocaleString('en-IN', {minimumFractionDigits: 2}) + ' | Spent expenditures computed flawlessly for your event layout grid.</td>';
        htmlRows += '<td><a href="/party?budget=' + partyBudget + '" class="btn-full-analysis"><i class="fa-solid fa-chart-line me-1"></i> View Full Analysis</a></td>';
        htmlRows += '</tr>';
    }

    // 💎 3. ஜுவல்லரி பிளானர் பட்ஜெட் விபரம் (இப்போ எந்த சின்டாக்ஸ் எர்ரரும் இல்லாமல் கச்சிதமாக லோடு ஆகும்!)
    if (jewelryBudget) {
        htmlRows += '<tr>';
        htmlRows += '<td><strong>💎 Jewelry Budget Plan</strong></td>';
        htmlRows += '<td class="text-muted">Total Jewelry Budget: $' + parseFloat(jewelryBudget).toLocaleString('en-US', {minimumFractionDigits: 2}) + ' | Partition models matching casual/formal attire vectors applied safely.</td>';
        htmlRows += '<td><a href="/jewelry?budget=' + jewelryBudget + '" class="btn-full-analysis"><i class="fa-solid fa-gem me-1"></i> View Full Analysis</a></td>';
        htmlRows += '</tr>';
    }

    // 💡 ஒருவேளை மூன்றும் இன்னும் பார்க்கவில்லை என்றால் மட்டும் காட்டும் வெற்று வரி
    if (htmlRows === '') {
        htmlRows = '<tr><td colspan="3" class="text-center py-4 text-muted fw-bold">No historical simulation records detected. Run a planner module to populate arrays!</td></tr>';
    }

    tableBody.innerHTML = htmlRows;
});
</script>
</body>
</html>
